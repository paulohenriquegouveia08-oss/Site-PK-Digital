name: Publicar o site

# Compila o site e publica no GitHub Pages a cada push na main.
#
# Automatico aqui (ao contrario do deploy da API na VPS) porque e' um
# site estatico: publicar errado nao derruba servico nenhum, e o passo
# anterior e' o proprio commit que a pessoa acabou de revisar.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes que o Pages exige. Sem `id-token` o passo de publicar
# falha com "missing token", que nao diz o que esta faltando.
permissions:
  contents: read
  pages: write
  id-token: write

# Duas publicacoes ao mesmo tempo se atropelariam. Aqui vale cancelar a
# antiga: quem importa e' sempre o commit mais novo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Rota direta nao pode dar 404
        run: |
          # O site usa BrowserRouter: /projeto/fitlife-academy e' uma
          # rota do JavaScript, nao um arquivo. O GitHub Pages procura o
          # arquivo, nao acha e devolve 404 — entao um link de projeto
          # compartilhado no WhatsApp abriria a pagina de erro.
          #
          # Servindo o proprio index.html como pagina de 404, o app
          # carrega e o roteador resolve o caminho. E' a solucao que o
          # Pages aceita para aplicacao de pagina unica.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
